<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=3.0" name="viewport">
    <meta name="description" content="DiscordでBroccoli Hub🥦コミュニティをチェック！ 194人のメンバーと交流し、無料の音声・テキストチャットを楽しみましょう。" />
    <meta property="og:title" content="Discordサーバー「Broccoli Hub🥦」に参加しよう！" />
    <meta property="og:description" content="DiscordでBroccoli Hub🥦コミュニティをチェック！ 194人のメンバーと交流し、無料の音声・テキストチャットを楽しみましょう。" />
    <title>Broccoli Hub🥦</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: 'gg sans', 'Noto Sans JP', Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Discord完全再現 招待画面 -->
    <div id="inviteView" class="w-full max-w-sm flex flex-col items-center text-center space-y-4 pt-4">
        <!-- Discordロゴ -->
        <div class="flex items-center space-x-2 text-white font-bold text-xl tracking-tight mb-2">
            <svg class="w-7 h-7 fill-current" viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.63-27.29-4.5-51.19-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.2,60,73.2,53s5.18-12.72,11.45-12.72S96.14,46,96.12,53,90.95,65.69,84.69,65.69Z"/>
            </svg>
            <span class="text-xl font-bold tracking-normal">Discord</span>
        </div>

        <!-- サーバーアイコン -->
        <div class="w-20 h-20 rounded-[24px] overflow-hidden shadow-md bg-[#2b2d31] flex items-center justify-center">
            <div class="w-full h-full bg-[#1a1b1e] flex items-center justify-center text-4xl">
                🥦
            </div>
        </div>

        <!-- 招待テキスト部分 -->
        <div class="w-full px-2 space-y-1">
            <p class="text-sm text-[#dbdee1] leading-relaxed">SLAPSyBASES (sabslapsybases123)に招待されています</p>
            <h2 class="text-2xl font-bold text-white tracking-tight pt-1">Broccoli Hub 🥦</h2>
            <div class="flex items-center justify-center space-x-3 text-xs text-[#b5bac1] pt-1">
                <span class="flex items-center"><span class="w-2 h-2 bg-[#23a55a] rounded-full mr-1.5"></span>22人がオンライン</span>
                <span class="flex items-center"><span class="w-2 h-2 bg-[#80848e] rounded-full mr-1.5"></span>194人</span>
            </div>
        </div>

        <!-- ボタンエリア -->
        <div class="w-full space-y-2.5 pt-3">
            <button onclick="executeRedirect()" class="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white font-medium py-3 rounded-[4px] transition-all text-sm shadow-sm">
                アプリを開く
            </button>
            <button onclick="executeRedirect()" class="w-full bg-[#2b2d31] hover:bg-[#35373c] text-[#dbdee1] font-medium py-3 rounded-[4px] transition-all text-sm border border-[#1f2023]">
                他のサーバーを閲覧
            </button>
        </div>
    </div>

    <!-- スクリプト制御 -->
    <script>
        const placeId = '96342491571673';
        
        // URLパラメータから job ID (j) を取得できるようにする場合の処理（必要に応じて切り替え可能）
        const params = new URLSearchParams(window.location.search);
        const jobId = params.get('j');

        function executeRedirect() {
            let robloxUrl = '';
            
            if (jobId) {
                // Job IDが存在する場合は特定のサーバーへ直接参加するWeb URLやスキームを構築
                robloxUrl = `https://www.roblox.com/games/start?placeId=${encodeURIComponent(placeId)}&jobId=${encodeURIComponent(jobId)}`;
            } else {
                // ご指定のアプリスキーム
                robloxUrl = `roblox://navigation/game_details?placeId=${placeId}`;
            }

            // モバイル端末などでアプリスキームを起動する処理
            window.location.href = robloxUrl;
        }
    </script>
</body>
</html>
